<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — EGRelay</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .not-found { min-height: 100vh; display:grid; place-items:center; text-align:center; padding:24px; }
    .not-found h1 { font-size:clamp(4rem,12vw,8rem); }
    .not-found p { color:var(--muted); line-height:1.6; }
  </style>
</head>
<body>
  <main class="not-found">
    <div>
      <p class="eyebrow"><span></span> Error 404</p>
      <h1>Lost signal.</h1>
      <p>The page you requested does not exist or has moved.</p>
      <a class="button primary" href="/">Return home</a>
    </div>
  </main>
</body>
</html>
